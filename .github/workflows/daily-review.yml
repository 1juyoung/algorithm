name: Daily code review

on:
  schedule:
    - cron: "7 15 * * *" # 매일 00:07 KST (UTC 15:07), 전날 푼 문제를 분석
    - cron: "7 18 * * *" # 03:07 KST 재시도 (Gemini 과부하로 실패했을 때만 실제로 동작)
    - cron: "7 22 * * *" # 07:07 KST 재시도
  workflow_dispatch:
    inputs:
      date:
        description: "분석할 날짜 YYYY-MM-DD (KST). 비우면 어제"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_FCM: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare gh-pages worktree
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git worktree add -B gh-pages site origin/gh-pages
          else
            git worktree add --orphan -b gh-pages site
          fi

      - name: Analyze solutions
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python .github/scripts/daily_review.py \
            --date "${{ inputs.date }}" \
            --site-dir site \
            --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            ${{ github.event_name == 'schedule' && '--skip-if-exists' || '' }}

      - name: Build site
        if: steps.review.outputs.data_path != ''
        run: |
          pip install --quiet pygments
          python .github/scripts/build_site.py --site-dir site

      - name: Publish to gh-pages
        if: steps.review.outputs.data_path != ''
        run: |
          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없어요."
          else
            git commit -m "review: ${{ steps.review.outputs.title }}"
            git push origin gh-pages
          fi

      - name: Notify (FCM)
        # 재시도 실행에서 "푼 문제 없음" 알림이 여러 번 가지 않도록, 그 알림은 00:07 실행에서만 보낸다
        if: >-
          env.HAS_FCM == 'true' && steps.review.outputs.skip != '1' &&
          (steps.review.outputs.count != '0' || github.event_name != 'schedule' || github.event.schedule == '7 15 * * *')
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FCM_TOPIC: algo
          NOTIFY_TITLE: ${{ steps.review.outputs.title }}
          NOTIFY_BODY: ${{ steps.review.outputs.body }}
          NOTIFY_URL: ${{ steps.review.outputs.url }}
        run: |
          pip install --quiet google-auth requests
          python .github/scripts/notify.py
